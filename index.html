<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Aquarium — WebGPU Real-Time Aquatic Ecosystem</title>
  <style>
    :root {
      --bg: #040b12;
      --panel: rgba(6, 18, 28, 0.72);
      --border: rgba(96, 215, 224, 0.22);
      --text: #e6f6fb;
      --muted: #84adc0;
      --accent: #38d9c0;
      --accent2: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 24px;
      transition: opacity 0.3s ease;
    }
    .hud.hidden { opacity: 0; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    .brand {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      max-width: 440px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .brand-eyebrow {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pulse-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.75); }
    }
    .model-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .model-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .stat-chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.09);
      padding: 2px 8px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    .controls-top {
      pointer-events: auto;
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 600px;
    }
    .pill {
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .pill:hover {
      color: var(--text);
      border-color: rgba(96, 215, 224, 0.55);
    }
    .pill.active {
      color: #031518;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
      box-shadow: 0 0 16px rgba(56, 217, 192, 0.35);
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }
    .action-dock {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.16s ease;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-1px);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #03151a;
      border: none;
      box-shadow: 0 4px 18px rgba(56, 217, 192, 0.28);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #5ef0d9, #60cdff);
    }

    .progress-wrap {
      width: 140px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .progress-label {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      font-variant-numeric: tabular-nums;
    }
    .progress-track {
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.08s linear;
    }

    .hint {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 11px;
      color: var(--muted);
    }
    kbd {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      padding: 1px 5px;
      color: var(--text);
      font-family: inherit;
      font-size: 10px;
    }

    .error-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(4, 11, 18, 0.94);
      padding: 24px;
      text-align: center;
      z-index: 99;
    }
    .error-card {
      max-width: 480px;
      background: #091824;
      border: 1px solid rgba(255, 100, 100, 0.35);
      border-radius: 16px;
      padding: 28px;
    }
    .error-card h2 { margin-bottom: 10px; color: #ff7b7b; }
    .error-card p { color: var(--muted); font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <canvas id="gpu-canvas"></canvas>

  <div class="hud" id="hud">
    <div class="top-bar">
      <div class="brand">
        <div class="brand-eyebrow">
          <span class="pulse-dot"></span>
          <span>WEBGPU AQUARIUM · PBR · CAUSTICS · 4x MSAA</span>
          <span id="archetype-badge" style="color:#38bdf8;font-weight:700;"></span>
        </div>
        <div class="model-title" id="model-name">Initializing Aquarium...</div>
        <div class="model-sub">
          <span class="stat-chip" id="stat-seed">Seed: —</span>
          <span class="stat-chip" id="stat-tris">Tris: —</span>
          <span class="stat-chip" id="stat-time">Gen: —</span>
          <span class="stat-chip" id="stat-count">In Tank: 0</span>
        </div>
      </div>

      <div class="controls-top" id="category-pills">
        <button class="pill active" data-cat="random">All Random</button>
        <button class="pill" data-cat="tropical_fish">Tropical Fish</button>
        <button class="pill" data-cat="koi">Koi / Goldfish</button>
        <button class="pill" data-cat="turtle">Sea Turtle</button>
        <button class="pill" data-cat="manta">Manta Ray</button>
        <button class="pill" data-cat="jellyfish">Jellyfish</button>
        <button class="pill" data-cat="seahorse">Seahorse</button>
        <button class="pill" data-cat="squid">Reef Squid</button>
        <button class="pill" data-cat="vallisneria">Ribbon Plant</button>
        <button class="pill" data-cat="stem_plant">Stem Plant</button>
        <button class="pill" data-cat="broadleaf_coral">Anubias / Coral</button>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="action-dock">
        <button class="btn btn-primary" id="btn-next">🐠 Spawn Now</button>
        <button class="btn" id="btn-mode">🌊 Mode: Aquarium</button>
        <button class="btn" id="btn-toggle-auto">⏸ Auto: ON</button>
        <button class="btn" id="btn-wire-spin">🌀 Orbit: ON</button>
        <button class="btn" id="btn-clear">🗑 Reset Tank</button>
        <div class="progress-wrap">
          <div class="progress-label">
            <span>Next Spawn</span>
            <span id="countdown-text">3.0s</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
      </div>

      <div class="hint">
        Drag: Orbit &nbsp;|&nbsp; Scroll: Zoom &nbsp;|&nbsp; <kbd>Space</kbd> Spawn &nbsp;|&nbsp; <kbd>H</kbd> Hide UI
      </div>
    </div>
  </div>

  <div class="error-overlay" id="error-overlay">
    <div class="error-card">
      <h2>WebGPU Unavailable</h2>
      <p id="error-message">
        このデモは WebGPU + WGSL シェーダーを使用しています。最新版の Chrome または Edge（WebGPU有効環境）で開いてください。
      </p>
    </div>
  </div>

  <script type="module">
    // =========================================================================
    // 1. Seeded PRNG, Math & Aquarium Constants
    // =========================================================================
    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function hslToRgb(h, s, l) {
      h = ((h % 1) + 1) % 1;
      const a = s * Math.min(l, 1 - l);
      const f = (n) => {
        const k = (n + h * 12) % 12;
        return l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
      };
      return [f(0), f(8), f(4)];
    }

    const v3 = {
      add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
      sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
      mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
      dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
      cross: (a, b) => [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0],
      ],
      norm: (a) => {
        const l = Math.hypot(a[0], a[1], a[2]) || 1;
        return [a[0] / l, a[1] / l, a[2] / l];
      },
      lerp: (a, b, t) => [
        a[0] + (b[0] - a[0]) * t,
        a[1] + (b[1] - a[1]) * t,
        a[2] + (b[2] - a[2]) * t,
      ],
    };

    function mat4Perspective(fovY, aspect, near, far) {
      const f = 1 / Math.tan(fovY / 2);
      const nf = 1 / (near - far);
      return new Float32Array([
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, far * nf, -1,
        0, 0, near * far * nf, 0,
      ]);
    }

    function mat4LookAt(eye, target, up) {
      const z = v3.norm(v3.sub(eye, target));
      const x = v3.norm(v3.cross(up, z));
      const y = v3.cross(z, x);
      return new Float32Array([
        x[0], y[0], z[0], 0,
        x[1], y[1], z[1], 0,
        x[2], y[2], z[2], 0,
        -v3.dot(x, eye), -v3.dot(y, eye), -v3.dot(z, eye), 1,
      ]);
    }

    function mat4Mul(a, b) {
      const out = new Float32Array(16);
      for (let c = 0; c < 4; c++) {
        for (let r = 0; r < 4; r++) {
          out[c * 4 + r] =
            a[0 * 4 + r] * b[c * 4 + 0] +
            a[1 * 4 + r] * b[c * 4 + 1] +
            a[2 * 4 + r] * b[c * 4 + 2] +
            a[3 * 4 + r] * b[c * 4 + 3];
        }
      }
      return out;
    }

    function mat4Transform3D(tx, ty, tz, yaw, pitch, scale) {
      const cy = Math.cos(yaw), sy = Math.sin(yaw);
      const cp = Math.cos(pitch), sp = Math.sin(pitch);
      return new Float32Array([
        cy * scale, 0, -sy * scale, 0,
        sy * sp * scale, cp * scale, cy * sp * scale, 0,
        sy * cp * scale, -sp * scale, cy * cp * scale, 0,
        tx, ty, tz, 1,
      ]);
    }

    const TANK_HALF_W = 5.8;
    const TANK_HALF_D = 3.2;
    const TANK_BASE_Y = -2.2;
    const TANK_WATER_Y = 2.95;
    const TANK_RIM_TOP = 3.25;

    function sandHeight(x, z) {
      const backSlope = 0.22 * Math.max(0, -z / TANK_HALF_D);
      const mound = 0.22 * Math.sin(x * 0.42 + 0.5) * Math.cos(z * 0.55);
      const ripple = 0.05 * Math.sin(x * 1.45 - z * 1.15);
      return -1.94 + mound + backSlope + ripple;
    }

    // =========================================================================
    // 2. Procedural Mesh Builder (13 floats/vert: pos3, norm3, col3, attrs4)
    //    attrs = [emissive, animWeight, phase, metalOrType]
    // =========================================================================
    const FLOATS_PER_VERT = 13;

    class MeshBuilder {
      constructor() {
        this.verts = [];
      }

      pushVert(p, n, c, m) {
        this.verts.push(
          p[0], p[1], p[2],
          n[0], n[1], n[2],
          c[0], c[1], c[2],
          m[0], m[1], m[2], m[3]
        );
      }

      addTri(p1, p2, p3, c1, c2, c3, m1, m2, m3, flip = false) {
        const e1 = v3.sub(p2, p1);
        const e2 = v3.sub(p3, p1);
        let n = v3.norm(v3.cross(e1, e2));
        if (flip) n = v3.mul(n, -1);
        if (flip) {
          this.pushVert(p1, n, c1, m1);
          this.pushVert(p3, n, c3, m3);
          this.pushVert(p2, n, c2, m2);
        } else {
          this.pushVert(p1, n, c1, m1);
          this.pushVert(p2, n, c2, m2);
          this.pushVert(p3, n, c3, m3);
        }
      }

      addTriNorm(p1, p2, p3, n1, n2, n3, c1, c2, c3, m1, m2, m3) {
        this.pushVert(p1, n1, c1, m1);
        this.pushVert(p2, n2, c2, m2);
        this.pushVert(p3, n3, c3, m3);
      }

      addQuad(p1, p2, p3, p4, c1, c2, c3, c4, m1, m2, m3, m4) {
        this.addTri(p1, p2, p3, c1, c2, c3, m1, m2, m3);
        this.addTri(p1, p3, p4, c1, c3, c4, m1, m3, m4);
      }

      addLoft(rings, colorFn, metaFn, closeStart = false, closeEnd = false) {
        const nRings = rings.length;
        const segs = rings[0].length;
        for (let i = 0; i < nRings - 1; i++) {
          const t0 = i / (nRings - 1);
          const t1 = (i + 1) / (nRings - 1);
          for (let j = 0; j < segs; j++) {
            const jn = (j + 1) % segs;
            const u0 = j / segs;
            const u1 = (j + 1) / segs;
            this.addQuad(
              rings[i][j], rings[i][jn], rings[i + 1][jn], rings[i + 1][j],
              colorFn(t0, u0), colorFn(t0, u1), colorFn(t1, u1), colorFn(t1, u0),
              metaFn(t0, u0), metaFn(t0, u1), metaFn(t1, u1), metaFn(t1, u0)
            );
          }
        }
        if (closeStart) {
          let center = [0, 0, 0];
          for (const p of rings[0]) center = v3.add(center, p);
          center = v3.mul(center, 1 / segs);
          for (let j = 0; j < segs; j++) {
            const jn = (j + 1) % segs;
            this.addTri(
              center, rings[0][jn], rings[0][j],
              colorFn(0, 0.5), colorFn(0, (j + 1) / segs), colorFn(0, j / segs),
              metaFn(0, 0.5), metaFn(0, (j + 1) / segs), metaFn(0, j / segs)
            );
          }
        }
        if (closeEnd) {
          const last = rings[nRings - 1];
          let center = [0, 0, 0];
          for (const p of last) center = v3.add(center, p);
          center = v3.mul(center, 1 / segs);
          for (let j = 0; j < segs; j++) {
            const jn = (j + 1) % segs;
            this.addTri(
              center, last[j], last[jn],
              colorFn(1, 0.5), colorFn(1, j / segs), colorFn(1, (j + 1) / segs),
              metaFn(1, 0.5), metaFn(1, j / segs), metaFn(1, (j + 1) / segs)
            );
          }
        }
      }

      addTube(points, radii, segs, colorFn, metaFn, capStart = true, capEnd = true) {
        const rings = [];
        let prevUp = [0, 1, 0];
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          const tan = i === 0
            ? v3.norm(v3.sub(points[1], points[0]))
            : i === points.length - 1
              ? v3.norm(v3.sub(points[i], points[i - 1]))
              : v3.norm(v3.sub(points[i + 1], points[i - 1]));

          if (Math.abs(v3.dot(tan, prevUp)) > 0.96) {
            prevUp = Math.abs(tan[0]) < 0.9 ? [1, 0, 0] : [0, 0, 1];
          }
          const right = v3.norm(v3.cross(prevUp, tan));
          const up = v3.norm(v3.cross(tan, right));
          prevUp = up;

          const r = radii[i];
          const ring = [];
          for (let j = 0; j < segs; j++) {
            const ang = (j / segs) * Math.PI * 2;
            const ca = Math.cos(ang) * r;
            const sa = Math.sin(ang) * r;
            ring.push([
              p[0] + right[0] * ca + up[0] * sa,
              p[1] + right[1] * ca + up[1] * sa,
              p[2] + right[2] * ca + up[2] * sa,
            ]);
          }
          rings.push(ring);
        }
        this.addLoft(rings, colorFn, metaFn, capStart, capEnd);
      }

      addLeafBlade(points, widths, normalHint, colorFn, metaFn, crease = 0.08) {
        const rows = [];
        let prevHint = normalHint || [0, 0, 1];
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          const tan = i === 0
            ? v3.norm(v3.sub(points[1], points[0]))
            : i === points.length - 1
              ? v3.norm(v3.sub(points[i], points[i - 1]))
              : v3.norm(v3.sub(points[i + 1], points[i - 1]));
          let hint = prevHint;
          if (Math.abs(v3.dot(tan, hint)) > 0.95) {
            hint = Math.abs(tan[0]) < 0.85 ? [1, 0, 0] : [0, 1, 0];
          }
          const side = v3.norm(v3.cross(hint, tan));
          const up = v3.norm(v3.cross(tan, side));
          prevHint = up;
          const w = widths[i];
          rows.push([
            v3.sub(p, v3.mul(side, w)),
            v3.add(p, v3.mul(up, w * crease)),
            v3.add(p, v3.mul(side, w)),
          ]);
        }
        for (let i = 0; i < rows.length - 1; i++) {
          const t0 = i / (rows.length - 1);
          const t1 = (i + 1) / (rows.length - 1);
          // Left half
          this.addQuad(
            rows[i][0], rows[i][1], rows[i + 1][1], rows[i + 1][0],
            colorFn(t0, 0), colorFn(t0, 0.5), colorFn(t1, 0.5), colorFn(t1, 0),
            metaFn(t0, 0), metaFn(t0, 0.5), metaFn(t1, 0.5), metaFn(t1, 0)
          );
          // Right half
          this.addQuad(
            rows[i][1], rows[i][2], rows[i + 1][2], rows[i + 1][1],
            colorFn(t0, 0.5), colorFn(t0, 1), colorFn(t1, 1), colorFn(t1, 0.5),
            metaFn(t0, 0.5), metaFn(t0, 1), metaFn(t1, 1), metaFn(t1, 0.5)
          );
        }
      }

      addEllipsoid(center, rx, ry, rz, segsU, segsV, colorFn, metaFn, displaceFn = null) {
        const rings = [];
        for (let iv = 0; iv <= segsV; iv++) {
          const v = iv / segsV;
          const phi = v * Math.PI;
          const sp = Math.sin(phi), cp = Math.cos(phi);
          const ring = [];
          for (let iu = 0; iu < segsU; iu++) {
            const u = iu / segsU;
            const theta = u * Math.PI * 2;
            const nx = sp * Math.cos(theta);
            const ny = cp;
            const nz = sp * Math.sin(theta);
            const disp = displaceFn ? displaceFn(nx, ny, nz) : 1.0;
            ring.push([
              center[0] + nx * rx * disp,
              center[1] + ny * ry * disp,
              center[2] + nz * rz * disp,
            ]);
          }
          rings.push(ring);
        }
        this.addLoft(rings, colorFn, metaFn, false, false);
      }

      addBox(center, size, rotY, color, meta) {
        const hx = size[0] * 0.5, hy = size[1] * 0.5, hz = size[2] * 0.5;
        const c = Math.cos(rotY), s = Math.sin(rotY);
        const tf = (x, y, z) => [
          center[0] + x * c - z * s,
          center[1] + y,
          center[2] + x * s + z * c,
        ];
        const pts = [
          tf(-hx, -hy, -hz), tf(hx, -hy, -hz), tf(hx, hy, -hz), tf(-hx, hy, -hz),
          tf(-hx, -hy, hz), tf(hx, -hy, hz), tf(hx, hy, hz), tf(-hx, hy, hz),
        ];
        const faces = [
          [0, 3, 2, 1], [4, 5, 6, 7],
          [0, 1, 5, 4], [2, 3, 7, 6],
          [0, 4, 7, 3], [1, 2, 6, 5],
        ];
        for (const f of faces) {
          this.addQuad(
            pts[f[0]], pts[f[1]], pts[f[2]], pts[f[3]],
            color, color, color, color,
            meta, meta, meta, meta
          );
        }
      }

      addPrism(base, dir, len, rBot, rTop, sides, tipH, colorBot, colorTop, metaBot, metaTop) {
        const d = v3.norm(dir);
        const ref = Math.abs(d[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
        const right = v3.norm(v3.cross(ref, d));
        const up = v3.norm(v3.cross(d, right));
        const topCenter = v3.add(base, v3.mul(d, len));
        const tip = v3.add(topCenter, v3.mul(d, tipH));

        const ringB = [], ringT = [];
        for (let i = 0; i < sides; i++) {
          const a = (i / sides) * Math.PI * 2;
          const ca = Math.cos(a), sa = Math.sin(a);
          const off = [right[0] * ca + up[0] * sa, right[1] * ca + up[1] * sa, right[2] * ca + up[2] * sa];
          ringB.push(v3.add(base, v3.mul(off, rBot)));
          ringT.push(v3.add(topCenter, v3.mul(off, rTop)));
        }
        for (let i = 0; i < sides; i++) {
          const inx = (i + 1) % sides;
          this.addQuad(
            ringB[i], ringB[inx], ringT[inx], ringT[i],
            colorBot, colorBot, colorTop, colorTop,
            metaBot, metaBot, metaTop, metaTop
          );
          if (tipH > 0.001) {
            this.addTri(ringT[i], ringT[inx], tip, colorTop, colorTop, colorTop, metaTop, metaTop, metaTop);
          } else {
            this.addTri(ringT[i], ringT[inx], topCenter, colorTop, colorTop, colorTop, metaTop, metaTop, metaTop);
          }
          this.addTri(ringB[inx], ringB[i], base, colorBot, colorBot, colorBot, metaBot, metaBot, metaBot);
        }
      }

      finalize(smoothNormals = true, anchorBottom = false) {
        const arr = new Float32Array(this.verts);
        const vertCount = arr.length / FLOATS_PER_VERT;
        let minX = Infinity, minY = Infinity, minZ = Infinity;
        let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
        for (let i = 0; i < arr.length; i += FLOATS_PER_VERT) {
          const x = arr[i], y = arr[i + 1], z = arr[i + 2];
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
          if (z < minZ) minZ = z; if (z > maxZ) maxZ = z;
        }
        const cx = (minX + maxX) * 0.5;
        const cy = (minY + maxY) * 0.5;
        const cz = (minZ + maxZ) * 0.5;
        const yOff = anchorBottom ? minY : cy;
        const span = Math.max(maxX - minX, maxY - minY, maxZ - minZ, 0.001);
        const scale = 2.85 / span;
        for (let i = 0; i < arr.length; i += FLOATS_PER_VERT) {
          arr[i] = (arr[i] - cx) * scale;
          arr[i + 1] = (arr[i + 1] - yOff) * scale;
          arr[i + 2] = (arr[i + 2] - cz) * scale;
        }

        if (smoothNormals) {
          const accum = new Map();
          for (let i = 0; i < arr.length; i += FLOATS_PER_VERT) {
            const key = `${Math.round(arr[i] * 400)}_${Math.round(arr[i + 1] * 400)}_${Math.round(arr[i + 2] * 400)}`;
            let n = accum.get(key);
            if (!n) {
              n = [0, 0, 0];
              accum.set(key, n);
            }
            n[0] += arr[i + 3];
            n[1] += arr[i + 4];
            n[2] += arr[i + 5];
          }
          for (const n of accum.values()) {
            const l = Math.hypot(n[0], n[1], n[2]) || 1;
            n[0] /= l; n[1] /= l; n[2] /= l;
          }
          for (let i = 0; i < arr.length; i += FLOATS_PER_VERT) {
            const key = `${Math.round(arr[i] * 400)}_${Math.round(arr[i + 1] * 400)}_${Math.round(arr[i + 2] * 400)}`;
            const n = accum.get(key);
            arr[i + 3] = n[0];
            arr[i + 4] = n[1];
            arr[i + 5] = n[2];
          }
        }

        return { data: arr, vertCount, triCount: Math.floor(vertCount / 3) };
      }

      raw() {
        const arr = new Float32Array(this.verts);
        return { data: arr, vertCount: arr.length / FLOATS_PER_VERT };
      }
    }

    // =========================================================================
    // 3. Aquarium Environment Builders (Sand, Rocks, Driftwood, Tank, Water)
    // =========================================================================
    function buildAquariumEnvironment() {
      // 3a. Substrate & Hardscape (surfaceFlag = 1)
      const subMb = new MeshBuilder();
      const nx = 48, nz = 28;
      const hw = TANK_HALF_W - 0.04;
      const hd = TANK_HALF_D - 0.04;

      const grid = [];
      for (let iz = 0; iz <= nz; iz++) {
        const row = [];
        const z = -hd + (iz / nz) * (2 * hd);
        for (let ix = 0; ix <= nx; ix++) {
          const x = -hw + (ix / nx) * (2 * hw);
          row.push([x, sandHeight(x, z), z]);
        }
        grid.push(row);
      }

      const sandColor = (x, z) => {
        const v = Math.sin(x * 3.1 + z * 2.4) * 0.04 + Math.cos(x * 7.2 - z * 5.1) * 0.02;
        return [0.64 + v, 0.58 + v * 0.9, 0.45 + v * 0.7];
      };
      const sandMeta = [0.0, 0.0, 0.0, 0.05];

      for (let iz = 0; iz < nz; iz++) {
        for (let ix = 0; ix < nx; ix++) {
          const p1 = grid[iz][ix];
          const p2 = grid[iz][ix + 1];
          const p3 = grid[iz + 1][ix + 1];
          const p4 = grid[iz + 1][ix];
          subMb.addQuad(
            p1, p4, p3, p2,
            sandColor(p1[0], p1[2]), sandColor(p4[0], p4[2]), sandColor(p3[0], p3[2]), sandColor(p2[0], p2[2]),
            sandMeta, sandMeta, sandMeta, sandMeta
          );
        }
      }

      // Sand side skirts down to TANK_BASE_Y (visible through glass!)
      const skirtCol = [0.46, 0.41, 0.32];
      for (let ix = 0; ix < nx; ix++) {
        // Front (+Z) & Back (-Z)
        const pf1 = grid[nz][ix], pf2 = grid[nz][ix + 1];
        subMb.addQuad(
          pf1, [pf1[0], TANK_BASE_Y + 0.02, pf1[2]], [pf2[0], TANK_BASE_Y + 0.02, pf2[2]], pf2,
          sandColor(pf1[0], pf1[2]), skirtCol, skirtCol, sandColor(pf2[0], pf2[2]),
          sandMeta, sandMeta, sandMeta, sandMeta
        );
        const pb1 = grid[0][ix], pb2 = grid[0][ix + 1];
        subMb.addQuad(
          pb2, [pb2[0], TANK_BASE_Y + 0.02, pb2[2]], [pb1[0], TANK_BASE_Y + 0.02, pb1[2]], pb1,
          sandColor(pb2[0], pb2[2]), skirtCol, skirtCol, sandColor(pb1[0], pb1[2]),
          sandMeta, sandMeta, sandMeta, sandMeta
        );
      }
      for (let iz = 0; iz < nz; iz++) {
        // Left (-X) & Right (+X)
        const pl1 = grid[iz][0], pl2 = grid[iz + 1][0];
        subMb.addQuad(
          pl1, [pl1[0], TANK_BASE_Y + 0.02, pl1[2]], [pl2[0], TANK_BASE_Y + 0.02, pl2[2]], pl2,
          sandColor(pl1[0], pl1[2]), skirtCol, skirtCol, sandColor(pl2[0], pl2[2]),
          sandMeta, sandMeta, sandMeta, sandMeta
        );
        const pr1 = grid[iz][nx], pr2 = grid[iz + 1][nx];
        subMb.addQuad(
          pr2, [pr2[0], TANK_BASE_Y + 0.02, pr2[2]], [pr1[0], TANK_BASE_Y + 0.02, pr1[2]], pr1,
          sandColor(pr2[0], pr2[2]), skirtCol, skirtCol, sandColor(pr1[0], pr1[2]),
          sandMeta, sandMeta, sandMeta, sandMeta
        );
      }

      // Smooth River Stones & Slate Rocks
      const rocks = [
        { x: -3.4, z: -1.35, rx: 1.05, ry: 0.72, rz: 0.88, seed: 1.1 },
        { x: -2.2, z: -1.75, rx: 0.72, ry: 0.55, rz: 0.65, seed: 2.4 },
        { x: -4.15, z: -0.35, rx: 0.65, ry: 0.42, rz: 0.58, seed: 3.7 },
        { x: 3.15, z: -1.4, rx: 1.12, ry: 0.78, rz: 0.84, seed: 4.5 },
        { x: 4.25, z: -0.75, rx: 0.62, ry: 0.45, rz: 0.55, seed: 5.9 },
        { x: 1.85, z: -1.95, rx: 0.58, ry: 0.42, rz: 0.52, seed: 6.3 },
        { x: -0.45, z: -1.85, rx: 0.55, ry: 0.34, rz: 0.48, seed: 7.2 },
      ];
      for (const rk of rocks) {
        const baseY = sandHeight(rk.x, rk.z) + rk.ry * 0.32;
        subMb.addEllipsoid(
          [rk.x, baseY, rk.z], rk.rx, rk.ry, rk.rz, 18, 12,
          (v, u) => {
            const moss = v < 0.38 ? 1.0 - v / 0.38 : 0.0;
            const shade = 0.22 + 0.08 * Math.sin(u * Math.PI * 6 + rk.seed);
            return [
              shade * (1 - moss * 0.28) + moss * 0.09,
              shade + moss * 0.14,
              shade * 1.05 - moss * 0.04,
            ];
          },
          () => [0, 0, 0, 0.15],
          (nx2, ny2, nz2) => 1.0 + 0.12 * Math.sin(nx2 * 4.2 + rk.seed) * Math.cos(nz2 * 3.8 - ny2 * 2.5)
        );
      }

      // Branching Sunken Driftwood arching across left/center
      const woodCol = (t) => [0.24 - t * 0.06, 0.15 - t * 0.03, 0.09 - t * 0.02];
      const woodMeta = () => [0, 0, 0, 0.1];
      const dwBaseY = sandHeight(-3.1, -1.1) - 0.1;
      subMb.addTube(
        [
          [-3.25, dwBaseY, -1.2],
          [-2.4, dwBaseY + 0.65, -0.85],
          [-1.35, dwBaseY + 1.15, -0.55],
          [-0.25, dwBaseY + 1.38, -0.35],
          [0.72, dwBaseY + 1.55, -0.45],
        ],
        [0.24, 0.18, 0.14, 0.09, 0.03], 10, woodCol, woodMeta
      );
      subMb.addTube(
        [
          [-1.7, dwBaseY + 0.95, -0.65],
          [-1.2, dwBaseY + 1.48, -1.05],
          [-0.65, dwBaseY + 1.88, -1.25],
        ],
        [0.11, 0.07, 0.025], 8, woodCol, woodMeta
      );
      subMb.addTube(
        [
          [-2.6, dwBaseY + 0.5, -0.92],
          [-2.15, dwBaseY + 0.25, -0.25],
          [-1.6, sandHeight(-1.6, 0.15) - 0.04, 0.15],
        ],
        [0.14, 0.1, 0.06], 8, woodCol, woodMeta
      );

      // Small Air-stone Diffuser near back-right rock
      const airX = 3.55, airZ = -1.1;
      const airY = sandHeight(airX, airZ) + 0.02;
      subMb.addPrism(
        [airX, airY, airZ], [0, 1, 0], 0.14, 0.18, 0.14, 12, 0.04,
        [0.35, 0.4, 0.44], [0.55, 0.62, 0.68], [0, 0, 0, 0.2], [0.1, 0, 0, 0.2]
      );

      const substrateMesh = subMb.raw();

      // 3b. Tank Cabinet Plinth, Rim Frame & Overhead Daylight LED Bar (surfaceFlag = 2)
      const frameMb = new MeshBuilder();
      const darkMetal = [0.06, 0.075, 0.095];
      const metalMeta = [0.0, 0.0, 0.0, 0.72];
      // Lower cabinet plinth
      frameMb.addBox([0, TANK_BASE_Y - 0.22, 0], [TANK_HALF_W * 2 + 0.34, 0.44, TANK_HALF_D * 2 + 0.34], 0, darkMetal, metalMeta);
      // Slim bottom & top tank trim rails
      const railT = 0.07;
      for (const sgnZ of [-1, 1]) {
        frameMb.addBox([0, TANK_RIM_TOP, sgnZ * TANK_HALF_D], [TANK_HALF_W * 2 + railT, railT, railT], 0, darkMetal, metalMeta);
        frameMb.addBox([0, TANK_BASE_Y, sgnZ * TANK_HALF_D], [TANK_HALF_W * 2 + railT, railT, railT], 0, darkMetal, metalMeta);
      }
      for (const sgnX of [-1, 1]) {
        frameMb.addBox([sgnX * TANK_HALF_W, TANK_RIM_TOP, 0], [railT, railT, TANK_HALF_D * 2 + railT], 0, darkMetal, metalMeta);
        frameMb.addBox([sgnX * TANK_HALF_W, TANK_BASE_Y, 0], [railT, railT, TANK_HALF_D * 2 + railT], 0, darkMetal, metalMeta);
        // Corner vertical silicone / aluminum posts
        for (const sgnZ of [-1, 1]) {
          frameMb.addBox(
            [sgnX * TANK_HALF_W, (TANK_BASE_Y + TANK_RIM_TOP) * 0.5, sgnZ * TANK_HALF_D],
            [0.055, TANK_RIM_TOP - TANK_BASE_Y, 0.055], 0, [0.04, 0.05, 0.065], metalMeta
          );
        }
        // Overhead LED fixture side brackets
        frameMb.addBox([sgnX * (TANK_HALF_W - 0.55), TANK_RIM_TOP + 0.36, 0], [0.08, 0.72, 0.14], 0, darkMetal, metalMeta);
      }
      // Overhead LED housing + glowing daylight diffuser underside
      frameMb.addBox([0, TANK_RIM_TOP + 0.74, 0], [TANK_HALF_W * 2 - 0.9, 0.14, 0.75], 0, [0.09, 0.11, 0.14], metalMeta);
      frameMb.addBox([0, TANK_RIM_TOP + 0.66, 0], [TANK_HALF_W * 2 - 1.25, 0.04, 0.45], 0, [0.95, 0.99, 1.0], [2.1, 0, 0, 0.1]);

      const frameMesh = frameMb.raw();

      // 3c. Transparent Glass Walls, Rippling Water Surface & Rising Bubbles
      const watMb = new MeshBuilder();
      const glassCol = [0.68, 0.92, 0.96];
      const glassMeta = [0.0, 0.0, 0.0, 0.0]; // w = 0 -> Glass
      const xW = TANK_HALF_W - 0.01, zD = TANK_HALF_D - 0.01;
      // Front, Back, Left, Right glass panes
      watMb.addQuad([-xW, TANK_BASE_Y, zD], [xW, TANK_BASE_Y, zD], [xW, TANK_RIM_TOP, zD], [-xW, TANK_RIM_TOP, zD], glassCol, glassCol, glassCol, glassCol, glassMeta, glassMeta, glassMeta, glassMeta);
      watMb.addQuad([xW, TANK_BASE_Y, -zD], [-xW, TANK_BASE_Y, -zD], [-xW, TANK_RIM_TOP, -zD], [xW, TANK_RIM_TOP, -zD], glassCol, glassCol, glassCol, glassCol, glassMeta, glassMeta, glassMeta, glassMeta);
      watMb.addQuad([-xW, TANK_BASE_Y, -zD], [-xW, TANK_BASE_Y, zD], [-xW, TANK_RIM_TOP, zD], [-xW, TANK_RIM_TOP, -zD], glassCol, glassCol, glassCol, glassCol, glassMeta, glassMeta, glassMeta, glassMeta);
      watMb.addQuad([xW, TANK_BASE_Y, zD], [xW, TANK_BASE_Y, -zD], [xW, TANK_RIM_TOP, -zD], [xW, TANK_RIM_TOP, zD], glassCol, glassCol, glassCol, glassCol, glassMeta, glassMeta, glassMeta, glassMeta);

      // Subdivided Water Surface (w = 1 -> Water Surface)
      const wx = 42, wz = 24;
      const whw = TANK_HALF_W - 0.03, whd = TANK_HALF_D - 0.03;
      const watCol = [0.32, 0.78, 0.88];
      const watMeta = [0.0, 0.0, 0.0, 1.0];
      for (let iz = 0; iz < wz; iz++) {
        const z0 = -whd + (iz / wz) * (2 * whd);
        const z1 = -whd + ((iz + 1) / wz) * (2 * whd);
        for (let ix = 0; ix < wx; ix++) {
          const x0 = -whw + (ix / wx) * (2 * whw);
          const x1 = -whw + ((ix + 1) / wx) * (2 * whw);
          watMb.addQuad(
            [x0, TANK_WATER_Y, z0], [x0, TANK_WATER_Y, z1], [x1, TANK_WATER_Y, z1], [x1, TANK_WATER_Y, z0],
            watCol, watCol, watCol, watCol, watMeta, watMeta, watMeta, watMeta
          );
        }
      }

      // Rising Air Bubbles (w = 2 -> Bubble) — mostly tiny, rare larger ones
      const bRng = mulberry32(90210);
      const nBubbles = 76;
      for (let b = 0; b < nBubbles; b++) {
        const fromAirstone = b < 46;
        const bx = fromAirstone
          ? airX + (bRng() - 0.5) * 0.48
          : (bRng() - 0.5) * (TANK_HALF_W * 1.75);
        const bz = fromAirstone
          ? airZ + (bRng() - 0.5) * 0.48
          : (bRng() - 0.5) * (TANK_HALF_D * 1.65);
        const startY = sandHeight(bx, bz) + 0.1;
        const u = bRng();
        const r = u < 0.78
          ? 0.014 + bRng() * 0.022
          : (u < 0.94 ? 0.032 + bRng() * 0.028 : 0.055 + bRng() * 0.035);
        // Larger bubbles rise slower; overall slower than the old 0.18–0.36 range
        const speed = (0.045 + bRng() * 0.05) * (0.04 / Math.max(r, 0.014));
        const phase = bRng();
        const bMeta = [startY, speed, phase, 2.0];
        const bCol = [0.85, 0.96, 1.0];
        watMb.addEllipsoid([bx, 0, bz], r, r * 0.92, r, 8, 5, () => bCol, () => bMeta);
      }

      const waterMesh = watMb.raw();
      return { substrateMesh, frameMesh, waterMesh };
    }

    // =========================================================================
    // 4. 10 Realistic Aquatic Creature & Aquatic Plant Generators
    // =========================================================================
    const NAME_PREFIX = [
      "Coral", "Azure", "Emerald", "Pearl", "Golden", "Jade",
      "Silver", "Reef", "Lagoon", "Sakura", "Cobalt", "Amber"
    ];

    const GENERATORS = {
      tropical_fish(rng) {
        const mb = new MeshBuilder();
        const speciesIdx = Math.floor(rng() * 4);
        const speciesNames = ["Clownfish", "Regal Tang", "Sunburst Butterfly", "Cardinal Tetra"];
        const bodyLen = 1.85 + rng() * 0.4;
        const bodyH = speciesIdx === 2 ? 0.85 : (speciesIdx === 3 ? 0.42 : 0.62);
        const bodyW = 0.22 + rng() * 0.06;

        const rings = [];
        const nSegs = 26, rSegs = 20;
        for (let i = 0; i < nSegs; i++) {
          const t = i / (nSegs - 1);
          const z = (0.5 - t) * bodyLen;
          const hEnv = Math.pow(Math.sin(Math.pow(t, 0.6) * Math.PI), 0.78);
          const wEnv = Math.sin(Math.pow(t, 0.52) * Math.PI);
          const peduncle = t > 0.78 ? 0.18 + 0.08 * (1 - (t - 0.78) / 0.22) : 1.0;
          const hh = 0.04 + bodyH * 0.5 * hEnv * (t > 0.78 ? 0.28 : 1.0);
          const hw = 0.025 + bodyW * wEnv * peduncle;
          const ring = [];
          for (let j = 0; j < rSegs; j++) {
            const a = (j / rSegs) * Math.PI * 2;
            ring.push([Math.cos(a) * hw, Math.sin(a) * hh, z]);
          }
          rings.push(ring);
        }

        const fishCol = (t, u) => {
          const belly = Math.sin(u * Math.PI * 2) < -0.25 ? 1 : 0;
          if (speciesIdx === 0) {
            // Clownfish: Vivid orange + crisp white bands with dark rim
            const band1 = Math.abs(t - 0.28);
            const band2 = Math.abs(t - 0.58);
            const band3 = Math.abs(t - 0.84);
            const d = Math.min(band1, band2, band3);
            if (d < 0.055) return [0.96, 0.96, 0.95];
            if (d < 0.075) return [0.06, 0.05, 0.05];
            return [0.95, 0.34, 0.07];
          } else if (speciesIdx === 1) {
            // Regal Tang: Royal blue + charcoal dorsal sweep + golden tail
            if (t > 0.82) return [0.96, 0.82, 0.12];
            if (Math.sin(u * Math.PI * 2) > 0.35 && t > 0.22 && t < 0.78) return [0.06, 0.09, 0.16];
            return [0.08, 0.32, 0.86];
          } else if (speciesIdx === 2) {
            // Butterflyfish: Warm sunlit gold + dark eye stripe + pearlescent belly
            if (Math.abs(t - 0.18) < 0.055) return [0.08, 0.08, 0.1];
            if (t > 0.76) return [0.96, 0.65, 0.1];
            return belly ? [0.95, 0.92, 0.82] : [0.95, 0.76, 0.18];
          }
          // Cardinal / Neon Tetra: Iridescent cyan dorsal stripe + crimson lower flank
          if (Math.sin(u * Math.PI * 2) > 0.15) return [0.08, 0.78, 0.92];
          return t > 0.32 ? [0.88, 0.14, 0.18] : [0.85, 0.9, 0.94];
        };

        mb.addLoft(
          rings,
          fishCol,
          (t) => [0.0, Math.pow(t, 1.35), 0.0, speciesIdx === 3 ? 0.65 : 0.38],
          true, true
        );

        // Eyes
        for (const side of [-1, 1]) {
          mb.addEllipsoid(
            [side * bodyW * 0.56, bodyH * 0.1, bodyLen * 0.33],
            0.045, 0.055, 0.055, 10, 8,
            (v) => (v < 0.38 ? [0.03, 0.03, 0.04] : [0.88, 0.84, 0.68]),
            () => [0, 0.05, 0, 0.95]
          );
        }

        // Dorsal Fin
        const dPts = [], dW = [];
        for (let i = 0; i < 10; i++) {
          const st = i / 9;
          const z = bodyLen * (0.12 - st * 0.54);
          const y = bodyH * 0.42 * (1 - st * 0.35);
          dPts.push([0, y, z]);
          dW.push(0.14 + 0.16 * Math.sin(st * Math.PI));
        }
        mb.addLeafBlade(
          dPts, dW, [1, 0, 0],
          (t) => (speciesIdx === 1 ? [0.08, 0.25, 0.75] : [0.95, 0.58, 0.18]),
          (t) => [0, 0.35 + t * 0.4, 0, 0.2], 0.04
        );

        // Forked Tail Fin
        const cPts = [], cW = [];
        for (let i = 0; i < 8; i++) {
          const st = i / 7;
          cPts.push([0, 0, -bodyLen * 0.46 - st * 0.44]);
          cW.push(0.08 + st * 0.32);
        }
        mb.addLeafBlade(
          cPts, cW, [1, 0, 0],

      koi(rng) {
        const mb = new MeshBuilder();

        const rings = [];
        const nSegs = 30, rSegs = 22;
        for (let i = 0; i < nSegs; i++) {
          const t = i / (nSegs - 1);
          const z = (0.5 - t) * bodyLen;
          const env = Math.sin(Math.pow(t, 0.56) * Math.PI);
          const hh = 0.04 + bodyH * 0.5 * env * (t > 0.8 ? 0.35 : 1.0);
          const hw = 0.03 + bodyW * 0.55 * env * (t > 0.8 ? 0.3 : 1.0);
          const ring = [];
          for (let j = 0; j < rSegs; j++) {
            const a = (j / rSegs) * Math.PI * 2;
            ring.push([Math.cos(a) * hw, Math.sin(a) * hh, z]);

          rings.push(ring);

        const koiColor = (t, u) => {
          const ang = u * Math.PI * 2;
          if (Math.sin(ang) < -0.45) return [0.95, 0.94, 0.91]; // Pearly belly
          const patch = Math.sin(t * 7.5 + seedOff) * Math.cos(ang * 2.0 + seedOff * 0.7)
                      + 0.45 * Math.sin(t * 14.0 - ang * 3.0);
          if (hasSumi && patch < -0.58) return [0.09, 0.09, 0.11]; // Sumi black ink
          if (patch > 0.12) return [0.92, 0.26, 0.08]; // Hi vermilion-orange
          return [0.96, 0.94, 0.9]; // Shiroji white
        };

        mb.addLoft(rings, koiColor, (t) => [0.0, Math.pow(t, 1.3), 0.0, 0.32], true, true);

        for (const side of [-1, 1]) {
          mb.addEllipsoid(

            0.045, 0.05, 0.05, 10, 8,
            (v) => (v < 0.4 ? [0.03, 0.03, 0.04] : [0.85, 0.65, 0.25]),
            () => [0, 0.04, 0, 0.92]
          );
          mb.addTube(
            [[side * 0.08, -0.05, bodyLen * 0.46], [side * 0.16, -0.1, bodyLen * 0.42], [side * 0.2, -0.15, bodyLen * 0.36]],
            [0.018, 0.012, 0.005], 5,
            () => [0.92, 0.62, 0.42], (t) => [0, 0.2 * t, side, 0.1]
          );
        }

        // Flowing Veil Tail
        const tailPts = [], tailW = [];
        for (let i = 0; i < 10; i++) {
          const st = i / 9;
          tailPts.push([0, -st * 0.06, -bodyLen * 0.48 - st * 0.62]);
          tailW.push(0.08 + st * 0.42);
        }
        mb.addLeafBlade(
          tailPts, tailW, [1, 0, 0],
          (t) => [0.96, 0.65 - t * 0.2, 0.45 - t * 0.15],
          (t) => [0, 0.85 + t * 0.45, 0, 0.15], 0.03
        );

        // Wide Pectoral Fins
        for (const side of [-1, 1]) {
          mb.addLeafBlade(
            [[side * bodyW * 0.5, -0.07, bodyLen * 0.18], [side * (bodyW + 0.24), -0.12, bodyLen * 0.04], [side * (bodyW + 0.38), -0.16, -bodyLen * 0.12]],
            [0.07, 0.15, 0.09],
            [0, 1, 0],
            () => [0.95, 0.88, 0.8],
            (t) => [0, 0.25 + t * 0.35, side, 0.15], 0.04
          );
        }

        const name = `${NAME_PREFIX[Math.floor(rng() * NAME_PREFIX.length)]} Nishikigoi`;

      turtle(rng) {

        const name = `${NAME_PREFIX[Math.floor(rng() * NAME_PREFIX.length)]} Sea Turtle`;

      },

      manta(rng) {
        const mb = new MeshBuilder();
        const hue = 0.55 + rng() * 0.08; // Deep slate-navy / teal-grey
        const bodyLen = 2.4 + rng() * 0.7;

          const halfW = 0.18 + wingSpan * Math.pow(wingEnv, 1.38);
          const halfH = 0.05 + 0.22 * Math.sin(t * Math.PI) * (1 - t * 0.4);
          const ring = [];
          for (let j = 0; j < ringSegs; j++) {

            const ca = Math.cos(ang), sa = Math.sin(ang);
            const wingCurve = Math.pow(Math.abs(ca), 1.6) * 0.16 * wingEnv;
            ring.push([
              ca * halfW,
              sa * halfH - wingCurve + Math.sin(t * Math.PI * 2) * 0.03,
              z - Math.abs(ca) * 0.45 * wingEnv,
            ]);
          }
          rings.push(ring);
        }

        mb.addLoft(
          rings,
          (t, u) => {
            const isBelly = Math.sin(u * Math.PI * 2) < -0.05;
            if (isBelly) return [0.88, 0.91, 0.93];
            const spot = Math.sin(t * 16 + u * 22) > 0.78 ? 0.14 : 0.0;
            return hslToRgb(hue, 0.42, 0.16 + spot + 0.08 * (1 - t));

          (t) => [0.0, 0.75, t * 3.0, 0.35],

        // Cephalic lobes at front (+Z)
        for (const side of [-1, 1]) {
          mb.addTube(
            [[side * 0.22, -0.02, bodyLen * 0.44], [side * 0.26, -0.04, bodyLen * 0.62], [side * 0.2, -0.06, bodyLen * 0.74]],

            () => [0, 0.15, 0, 0.3]
          );
        }

        // Slender Tail
        const tailPts = [], tailRad = [];
        for (let i = 0; i < 16; i++) {
          const st = i / 15;
          tailPts.push([Math.sin(st * 3.2) * 0.06 * st, Math.cos(st * 2.5) * 0.04 * st, -bodyLen * 0.48 - st * 1.4]);
          tailRad.push(0.045 * (1 - st * 0.88));

        const name = `${NAME_PREFIX[Math.floor(rng() * NAME_PREFIX.length)]} Manta Ray`;
        return { mesh: mb.finalize(true), name, animMode: 2, sss: 0.3, accent: [0.32, 0.78, 0.92] };
      },

      jellyfish(rng) {

      seahorse(rng) {

        }

        // Delicate Dorsal Fin
        mb.addLeafBlade(
          [[0, 0.35, -0.22], [0, 0.12, -0.3], [0, -0.12, -0.25]],
          [0.05, 0.15, 0.05], [1, 0, 0],

      squid(rng) {

          for (let j = 0; j < rSegs; j++) {
            const a = (j / rSegs) * Math.PI * 2;
            const fin = t < 0.42 ? 1 + 0.72 * Math.sin((t / 0.42) * Math.PI) * Math.pow(Math.abs(Math.cos(a)), 6) : 1;
            ring.push([Math.cos(a) * r * fin, y, Math.sin(a) * r]);
          }
          mRings.push(ring);

        mb.addLoft(

          (t) => v3.lerp(finCol, baseCol, 0.3 + 0.5 * t),

        // 10 Tentacles

        }

        const name = `${NAME_PREFIX[Math.floor(rng() * NAME_PREFIX.length)]} Reef Squid`;
        return { mesh: mb.finalize(true), name, animMode: 1, sss: 0.65, accent: baseCol };
      },

      vallisneria(rng) {
        const mb = new MeshBuilder();
        const hue = 0.27 + rng() * 0.09; // Lush aquatic green
        const nBlades = 13 + Math.floor(rng() * 7);

        for (let b = 0; b < nBlades; b++) {
          const ang = (b / nBlades) * Math.PI * 2 + (rng() - 0.5) * 0.3;
          const spreadR = 0.06 + rng() * 0.18;
          const h = 1.65 + rng() * 1.25;

            pts.push([
              Math.cos(ang) * (spreadR + curve) + Math.sin(ang) * twist,
              st * h,
              Math.sin(ang) * (spreadR + curve) - Math.cos(ang) * twist,
            ]);
            widths.push(wBase * Math.sin(Math.pow(st, 0.35) * Math.PI * 0.92 + 0.12));
          }
          mb.addLeafBlade(
            pts, widths, [Math.cos(ang), 0, Math.sin(ang)],
            (t) => hslToRgb(hue + t * 0.04, 0.62 + t * 0.12, 0.22 + t * 0.24),

      stem_plant(rng) {

          // Leaf whorls at nodes
          for (let i = 2; i < nodes; i++) {
            const st = i / (nodes - 1);
            const p = pts[i];
            const nLeaves = 4 + (i % 2);
            const leafSize = 0.28 + 0.14 * Math.sin(st * Math.PI);
            for (let l = 0; l < nLeaves; l++) {
              const la = (l / nLeaves) * Math.PI * 2 + i * 0.6;
              const lPts = [

                [p[0] + Math.cos(la) * leafSize * 0.55, p[1] + 0.05, p[2] + Math.sin(la) * leafSize * 0.55],
                [p[0] + Math.cos(la) * leafSize, p[1] + 0.02, p[2] + Math.sin(la) * leafSize],
              ];
              mb.addLeafBlade(
                lPts, [0.025, 0.08, 0.015], [0, 1, 0],
                (lt) => {
                  const h = isReddish ? leafHue - st * 0.03 : leafHue + lt * 0.03;
                  return hslToRgb(h, 0.62 + st * 0.15, 0.26 + st * 0.18 + lt * 0.08);
                },
                () => [0, st, s * 0.9, 0.08], 0.12
              );
            }
          }
        }

        const name = isReddish
          ? `${NAME_PREFIX[Math.floor(rng() * NAME_PREFIX.length)]} Ludwigia`
          : `${NAME_PREFIX[Math.floor(rng() * NAME_PREFIX.length)]} Rotala`;
        return { mesh: mb.finalize(true, true), name, animMode: 7, sss: 0.72, accent: isReddish ? [0.85, 0.42, 0.28] : [0.3, 0.82, 0.45] };
      },

      broadleaf_coral(rng) {
        const mb = new MeshBuilder();
        const isAnubias = rng() > 0.45;
        if (isAnubias) {
          // Rosette of broad glossy Anubias / Amazon Sword leaves
          const hue = 0.32 + rng() * 0.07;
          const nLeaves = 9 + Math.floor(rng() * 5);
          for (let l = 0; l < nLeaves; l++) {
            const ang = (l / nLeaves) * Math.PI * 2 + (rng() - 0.5) * 0.35;
            const len = 0.75 + rng() * 0.55;
            const elev = 0.45 + rng() * 0.55;
            const lPts = [
              [0, 0.05, 0],
              [Math.cos(ang) * len * 0.35, elev * 0.65, Math.sin(ang) * len * 0.35],
              [Math.cos(ang) * len * 0.75, elev * 0.95, Math.sin(ang) * len * 0.75],
              [Math.cos(ang) * len * 1.1, elev * 0.72, Math.sin(ang) * len * 1.1],
            ];
            mb.addLeafBlade(
              lPts, [0.03, 0.18, 0.24, 0.03], [0, 1, 0],
              (t) => hslToRgb(hue, 0.65, 0.18 + t * 0.18),
              (t) => [0, t * 0.6, l * 0.5, 0.25], 0.12
            );
          }
          const name = `${NAME_PREFIX[Math.floor(rng() * NAME_PREFIX.length)]} Anubias`;
          return { mesh: mb.finalize(true, true), name, animMode: 7, sss: 0.65, accent: [0.22, 0.75, 0.45] };
        }

        // Natural Soft Reef Coral / Sea Anemone
        const coralHue = [0.02, 0.07, 0.95, 0.46][Math.floor(rng() * 4)];
        const coralPhase = rng() * Math.PI * 2;
        const maxDepth = 3;
        function growCoral(pos, dir, len, rad, depth) {
          const steps = 6;
          const pts = [], rads = [];
          let cur = pos, curDir = v3.norm(dir);
          for (let i = 0; i < steps; i++) {
            const t = i / (steps - 1);
            pts.push(cur);
            rads.push(rad * (1 - t * 0.35));
            curDir = v3.norm(v3.add(curDir, [(rng() - 0.5) * 0.18, 0.18, (rng() - 0.5) * 0.18]));
            cur = v3.add(cur, v3.mul(curDir, len / (steps - 1)));
          }
          mb.addTube(
            pts, rads, 8,
            (t) => hslToRgb(coralHue + t * 0.03, 0.62, 0.38 + depth * 0.08 + t * 0.08),
            (t) => [depth === maxDepth ? 0.18 : 0.0, 0.18 * (depth + t), coralPhase, 0.1]
          );
          if (depth < maxDepth) {
            const tipPos = pts[pts.length - 1];
            const branches = depth === 0 ? 4 : 2 + Math.floor(rng() * 2);
            for (let b = 0; b < branches; b++) {
              const a = (b / branches) * Math.PI * 2 + rng() * 0.5;
              const newDir = v3.norm([curDir[0] + Math.cos(a) * 0.55, curDir[1] + 0.5, curDir[2] + Math.sin(a) * 0.55]);
              growCoral(tipPos, newDir, len * 0.7, rad * 0.66, depth + 1);
            }
          }
        }
        growCoral([0, 0, 0], [0, 1, 0], 0.75, 0.16, 0);
        const name = `${NAME_PREFIX[Math.floor(rng() * NAME_PREFIX.length)]} Reef Coral`;
        return { mesh: mb.finalize(true, true), name, animMode: 7, sss: 0.58, accent: hslToRgb(coralHue, 0.75, 0.58) };
      },
    };

    const CATEGORIES = Object.keys(GENERATORS);
    const GROUNDED_CATS = new Set(["vallisneria", "stem_plant", "broadleaf_coral"]);
    const DIRECTIONAL_CATS = new Set(["tropical_fish", "koi", "turtle", "manta"]);
    const SWIMMING_CATS = CATEGORIES.filter((c) => !GROUNDED_CATS.has(c));
    const PLANT_CATS = CATEGORIES.filter((c) => GROUNDED_CATS.has(c));

    // =========================================================================
    // 5. WebGPU Pipelines & WGSL Shaders (4x MSAA + Caustics + Glass/Water + Bloom)
    // =========================================================================
    const canvas = document.getElementById("gpu-canvas");
    const hudEl = document.getElementById("hud");
    const modelNameEl = document.getElementById("model-name");
    const archetypeBadgeEl = document.getElementById("archetype-badge");
    const statSeedEl = document.getElementById("stat-seed");
    const statTrisEl = document.getElementById("stat-tris");
    const statTimeEl = document.getElementById("stat-time");
    const statCountEl = document.getElementById("stat-count");
    const progressFillEl = document.getElementById("progress-fill");
    const countdownTextEl = document.getElementById("countdown-text");

    function showError(msg) {
      document.getElementById("error-message").textContent = msg;

    if (!navigator.gpu) {
      showError("このブラウザは WebGPU に対応していません。Chrome / Edge の最新版をお使いください。");
      throw new Error("WebGPU unsupported");

    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) {
