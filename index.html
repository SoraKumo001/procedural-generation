    const device = await adapter.requestDevice();
    const context = canvas.getContext("webgpu");
    const swapFormat = navigator.gpu.getPreferredCanvasFormat();
    const HDR_FORMAT = "rgba16float";
    const SAMPLE_COUNT = 4;

    // 5a. Aquarium Gallery Backdrop
    const BACKDROP_WGSL = /* wgsl */`
      struct Uniforms {
        viewProj : mat4x4f,
        model    : mat4x4f,
        camTime  : vec4f,
        anim     : vec4f,
        accent   : vec4f,
      };
      @group(0) @binding(0) var<uniform> u : Uniforms;

      struct BGOut {
        @builtin(position) pos : vec4f,
        @location(0) uv : vec2f,
      };

      @vertex
      fn vs_bg(@builtin(vertex_index) idx : u32) -> BGOut {
        var pts = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
        var out : BGOut;
        out.pos = vec4f(pts[idx], 0.9999, 1.0);
        out.uv = pts[idx] * 0.5 + 0.5;
        return out;
      }

      @fragment
      fn fs_bg(inp : BGOut) -> @location(0) vec4f {
        let t = u.camTime.w;
        let deep = vec3f(0.012, 0.025, 0.042);
        let mid  = vec3f(0.032, 0.088, 0.135) + u.accent.rgb * 0.015;
        var col = mix(deep, mid, smoothstep(0.05, 0.85, inp.uv.y));
        let glow = exp(-length((inp.uv - vec2f(0.5, 0.62)) * vec2f(1.2, 1.8)) * 2.2);
        let shimmer = 0.88 + 0.12 * sin(inp.uv.x * 6.0 + t * 0.4);
        col += vec3f(0.04, 0.14, 0.2) * glow * shimmer;
        return vec4f(col, 1.0);
      }
    `;

    // 5b. Main Aquarium Opaque PBR + Caustics + Procedural Animation Shader
    const SCENE_WGSL = /* wgsl */`
      struct Uniforms {
        viewProj : mat4x4f,
        model    : mat4x4f,
        camTime  : vec4f, // xyz = cameraPos, w = time
        anim     : vec4f, // x = animMode, y = sssAmount, z = surfaceFlag (0=entity, 1=sand/rock, 2=frame/LED), w = inspectFlag
        accent   : vec4f,
      };
      @group(0) @binding(0) var<uniform> u : Uniforms;

      struct VSIn {
        @location(0) pos   : vec3f,
        @location(1) norm  : vec3f,
        @location(2) color : vec3f,
        @location(3) attrs : vec4f, // x=emissive, y=animWeight, z=phase, w=metalness
      };

      struct VSOut {
        @builtin(position) clipPos : vec4f,
        @location(0) worldPos : vec3f,
        @location(1) worldNorm: vec3f,
        @location(2) color    : vec3f,
        @location(3) attrs    : vec4f,
        @location(4) localPos : vec3f,
      };

      @vertex
      fn vs_main(v : VSIn) -> VSOut {
        var p = v.pos;
        let t = u.camTime.w;
        let mode = u.anim.x;
        let w = v.attrs.y;
        let phase = v.attrs.z;

        if (mode > 0.5 && mode < 1.5) {
          // Squid / Seahorse leisurely sway
          let wave = sin(t * 1.35 + phase + p.y * 2.0) * 0.07 * w;
          p.x += wave;
          p.z += cos(t * 1.15 + phase + p.y * 1.8) * 0.06 * w;
        } else if (mode >= 1.5 && mode < 2.5) {
          // Manta / Turtle slow wing stroke
          let wingDist = abs(p.x);
          p.y += sin(t * 1.55 - p.z * 1.0) * 0.28 * wingDist * w;
        } else if (mode >= 3.5 && mode < 4.5) {
          // Fish / Koi soft lateral body wave (tail-weighted via animWeight)
          p.x += sin(t * 3.4 - p.z * 2.8 + phase) * 0.11 * w;
        } else if (mode >= 5.5 && mode < 6.5) {
          // Jellyfish asymmetric bell pulse + tentacle trail
          let raw = sin(t * 1.15 + phase);
          let pulse = raw * mix(0.55, 1.0, step(0.0, raw));
          let bellMask = clamp(p.y + 0.5, 0.0, 1.0);
          p.x *= 1.0 + pulse * 0.12 * bellMask * w;
          p.z *= 1.0 + pulse * 0.12 * bellMask * w;
          p.y += pulse * 0.055 * w;
          p.x += sin(t * 0.85 + phase + p.y * 2.2) * 0.055 * (1.0 - bellMask) * w;
        } else if (mode >= 6.5) {
          // Rooted Aquatic Plant slow current sway (y=0 anchored)
          let h = max(v.pos.y, 0.0);
          let sway = pow(h, 1.35);
          p.x += sin(t * 0.95 + phase + h * 1.5) * 0.10 * sway;
          p.z += cos(t * 0.75 + phase * 1.3 + h * 1.2) * 0.065 * sway;
        }

        let wp = (u.model * vec4f(p, 1.0)).xyz;
        let wn = normalize((u.model * vec4f(v.norm, 0.0)).xyz);

        var out : VSOut;
        out.clipPos = u.viewProj * vec4f(wp, 1.0);
        out.worldPos = wp;
        out.worldNorm = wn;
        out.color = v.color;
        out.attrs = v.attrs;
        out.localPos = v.pos;
        return out;
      }

      fn hash3(p : vec3f) -> f32 {
        var q = fract(p * 0.3183099 + vec3f(0.1, 0.2, 0.3));
        q *= 17.0;
        return fract(q.x * q.y * q.z * (q.x + q.y + q.z));
      }

      fn noise3(x : vec3f) -> f32 {
        let i = floor(x);
        let f = fract(x);
        let u2 = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(mix(hash3(i + vec3f(0,0,0)), hash3(i + vec3f(1,0,0)), u2.x),
              mix(hash3(i + vec3f(0,1,0)), hash3(i + vec3f(1,1,0)), u2.x), u2.y),
          mix(mix(hash3(i + vec3f(0,0,1)), hash3(i + vec3f(1,0,1)), u2.x),
              mix(hash3(i + vec3f(0,1,1)), hash3(i + vec3f(1,1,1)), u2.x), u2.y),
          u2.z
        );
      }

      fn fbm(p : vec3f) -> f32 {
        return 0.55 * noise3(p) + 0.30 * noise3(p * 2.13) + 0.15 * noise3(p * 4.41);
      }

      // Animated underwater caustics pattern (slow, soft drift)
      fn caustics(xz : vec2f, t : f32) -> f32 {
        let p1 = xz * 1.45 + vec2f(t * 0.18, -t * 0.14);
        let p2 = xz * 1.85 + vec2f(-t * 0.15, t * 0.20);
        let w1 = sin(p1.x * 2.2 + sin(p1.y * 2.6 + t * 0.55));
        let w2 = cos(p2.y * 2.4 + sin(p2.x * 2.1 - t * 0.48));
        let ridge = 1.0 - abs(w1 + w2) * 0.5;
        return pow(clamp(ridge, 0.0, 1.0), 3.6);
      }

      fn distGGX(N : vec3f, H : vec3f, rough : f32) -> f32 {
        let a = rough * rough;
        let a2 = a * a;
        let NdotH = max(dot(N, H), 0.0);
        let denom = (NdotH * NdotH * (a2 - 1.0) + 1.0);
        return a2 / max(3.14159265 * denom * denom, 0.0001);
      }

      fn geomSchlick(NdotV : f32, rough : f32) -> f32 {
        let r = rough + 1.0;
        let k = (r * r) / 8.0;
        return NdotV / (NdotV * (1.0 - k) + k);
      }

      fn geomSmith(N : vec3f, V : vec3f, L : vec3f, rough : f32) -> f32 {
        return geomSchlick(max(dot(N, V), 0.0), rough) * geomSchlick(max(dot(N, L), 0.0), rough);
      }

      fn fresnelSchlick(cosTheta : f32, F0 : vec3f) -> vec3f {
        return F0 + (1.0 - F0) * pow(clamp(1.0 - cosTheta, 0.0, 1.0), 5.0);
      }

      fn evalLight(L : vec3f, lightCol : vec3f, N : vec3f, V : vec3f, albedo : vec3f, metal : f32, rough : f32, F0 : vec3f) -> vec3f {
        let H = normalize(V + L);
        let NDF = distGGX(N, H, rough);
        let G = geomSmith(N, V, L, rough);
        let F = fresnelSchlick(max(dot(H, V), 0.0), F0);
        let NdotL = max(dot(N, L), 0.0);
        let NdotV = max(dot(N, V), 0.001);
        let spec = (NDF * G * F) / max(4.0 * NdotV * NdotL, 0.001);
        let kD = (vec3f(1.0) - F) * (1.0 - metal);
        return (kD * albedo / 3.14159265 + spec) * lightCol * NdotL;
      }

      @fragment
      fn fs_main(inp : VSOut) -> @location(0) vec4f {
        let surf = u.anim.z;
        let t = u.camTime.w;

        // Micro-bump from localPos (higher frequency for sand/rocks)
        let nFreq = select(8.0, 14.0, surf > 0.5 && surf < 1.5);
        let eps = 0.02;
        let f0 = fbm(inp.localPos * nFreq);
        let fx = fbm((inp.localPos + vec3f(eps, 0.0, 0.0)) * nFreq);
        let fy = fbm((inp.localPos + vec3f(0.0, eps, 0.0)) * nFreq);
        let fz = fbm((inp.localPos + vec3f(0.0, 0.0, eps)) * nFreq);
        let grad = vec3f(fx - f0, fy - f0, fz - f0) / eps;

        let bumpStrength = select(mix(0.06, 0.015, inp.attrs.w), 0.04, surf > 0.5);
        let N = normalize(inp.worldNorm - grad * bumpStrength);
        let V = normalize(u.camTime.xyz - inp.worldPos);

        let albedo = inp.color * (0.88 + 0.24 * f0);
        let metal = clamp(inp.attrs.w, 0.0, 1.0);
        let rough = clamp(mix(0.48, 0.16, metal) + (f0 - 0.5) * 0.16, 0.08, 0.92);
        let F0 = mix(vec3f(0.04), albedo, metal);

        // Overhead Daylight Aquarium LED + Underwater Caustics
        let L1 = normalize(vec3f(0.14, 0.96, 0.22));
        let L2 = normalize(vec3f(-0.65, 0.35, 0.65));
        let L3 = normalize(vec3f(0.45, -0.5, -0.55));

        var causticBoost = 0.0;
        if (surf < 1.5 && u.anim.w < 0.5) {
          let depthBelow = clamp((2.95 - inp.worldPos.y) * 0.28, 0.0, 1.0);
          let cVal = caustics(inp.worldPos.xz + inp.worldPos.y * 0.18, t);
          let cStrength = select(0.50, 1.12, surf > 0.5);
          causticBoost = cVal * max(N.y, 0.12) * depthBelow * cStrength;
        }

        var Lo = vec3f(0.0);
        Lo += evalLight(L1, vec3f(2.6, 2.75, 2.7) * (1.0 + causticBoost), N, V, albedo, metal, rough, F0);
        Lo += evalLight(L2, vec3f(0.45, 0.72, 0.85), N, V, albedo, metal, rough, F0);
        Lo += evalLight(L3, vec3f(0.22, 0.42, 0.52), N, V, albedo, metal, rough, F0);

        // Subsurface Scattering (SSS) wrap for leaves, coral & jellyfish
        let sssWrap = max(0.0, (dot(-N, L1) + 0.55) / 1.55);
        let sss = albedo * u.anim.y * pow(sssWrap, 1.8) * 0.72;

        let hemi = mix(vec3f(0.06, 0.14, 0.19), vec3f(0.22, 0.36, 0.42), N.y * 0.5 + 0.5);
        let rim = pow(1.0 - max(dot(N, V), 0.0), 3.6) * vec3f(0.18, 0.42, 0.52);
        let emissive = inp.color * inp.attrs.x;

        var col = hemi * albedo + Lo + sss + rim + emissive;

        // Underwater depth absorption (slightly stronger teal falloff)
        if (surf < 1.5 && u.anim.w < 0.5) {
          let dist = length(u.camTime.xyz - inp.worldPos);
          let waterTint = vec3f(0.02, 0.14, 0.22);
          let waterFog = clamp((dist - 4.5) / 18.0, 0.0, 0.62);
          col = mix(col, waterTint, waterFog);
        }

        return vec4f(col, 1.0);
      }
    `;

    // 5c. Transparent Glass Tank Walls, Rippling Water Surface & Rising Bubbles
    const WATER_WGSL = /* wgsl */`
      struct Uniforms {
        viewProj : mat4x4f,
        model    : mat4x4f,
        camTime  : vec4f,
        anim     : vec4f,
        accent   : vec4f,
      };
      @group(0) @binding(0) var<uniform> u : Uniforms;

      struct VSIn {
        @location(0) pos   : vec3f,
        @location(1) norm  : vec3f,
        @location(2) color : vec3f,
        @location(3) attrs : vec4f, // w: 0=glass, 1=water surface, 2=bubble
      };

      struct VSOut {
        @builtin(position) clipPos : vec4f,
        @location(0) worldPos : vec3f,
        @location(1) worldNorm: vec3f,
        @location(2) color    : vec3f,
        @location(3) attrs    : vec4f,
      };

      @vertex
      fn vs_water(v : VSIn) -> VSOut {
        var p = v.pos;
        var n = v.norm;
        let t = u.camTime.w;
        let kind = v.attrs.w;

        if (kind > 0.5 && kind < 1.5) {
          // Multi-octave water surface: broad swell + mid ripple + fine chop
          let w1 = sin(p.x * 0.95 + t * 0.85) * cos(p.z * 1.05 - t * 0.72) * 0.038;
          let w2 = sin(p.x * 1.9 + p.z * 1.4 - t * 1.45) * 0.016;
          let w3 = sin((p.x - p.z) * 3.6 + t * 2.1) * cos(p.x * 2.8 - t * 1.8) * 0.007;
          p.y += w1 + w2 + w3;
          let dx = 0.95 * cos(p.x * 0.95 + t * 0.85) * cos(p.z * 1.05 - t * 0.72) * 0.038
                 + 1.9 * cos(p.x * 1.9 + p.z * 1.4 - t * 1.45) * 0.016
                 + 3.6 * cos((p.x - p.z) * 3.6 + t * 2.1) * cos(p.x * 2.8 - t * 1.8) * 0.007
                 - 2.8 * sin((p.x - p.z) * 3.6 + t * 2.1) * sin(p.x * 2.8 - t * 1.8) * 0.007;
          let dz = -1.05 * sin(p.x * 0.95 + t * 0.85) * sin(p.z * 1.05 - t * 0.72) * 0.038
                 + 1.4 * cos(p.x * 1.9 + p.z * 1.4 - t * 1.45) * 0.016
                 - 3.6 * cos((p.x - p.z) * 3.6 + t * 2.1) * cos(p.x * 2.8 - t * 1.8) * 0.007;
          n = normalize(vec3f(-dx, 1.0, -dz));
        } else if (kind >= 1.5) {
          // Rising air bubbles: ease near surface, organic wobble, inflate then flatten
          let startY = v.attrs.x;
          let speed = v.attrs.y;
          let phase = v.attrs.z;
          let prog = fract(phase + t * speed);
          let ease = prog * prog * (3.0 - 2.0 * prog);
          let nearTop = smoothstep(0.72, 1.0, prog);
          let travel = max(2.92 - startY, 0.2);
          let rise = mix(prog, ease, 0.65) * (1.0 - nearTop * 0.18);
          let inflate = 1.0 + prog * 0.26;
          let flatten = mix(1.0, 0.45, nearTop);
          // Rest mesh sits at y~0; scale local height, lift, wobble, and push out along normal
          p.y = v.pos.y * inflate * flatten + startY + rise * travel;
          let wob1 = sin(t * 1.15 + phase * 18.0 + prog * 5.5) * 0.055;
          let wob2 = sin(t * 0.62 + phase * 11.0 + prog * 3.2) * 0.035;
          p.x = v.pos.x + wob1 + wob2 + n.x * prog * 0.018;
          p.z = v.pos.z
              + cos(t * 0.98 + phase * 14.0 + prog * 4.8) * 0.048
              + cos(t * 0.55 + phase * 9.0 + prog * 2.6) * 0.028
              + n.z * prog * 0.018;
          // Flatten horizontally near the surface as the bubble pops
          p.x += n.x * nearTop * 0.012;
          p.z += n.z * nearTop * 0.012;
        }

        let wp = (u.model * vec4f(p, 1.0)).xyz;
        let wn = normalize((u.model * vec4f(n, 0.0)).xyz);

        var out : VSOut;
        out.clipPos = u.viewProj * vec4f(wp, 1.0);
        out.worldPos = wp;
        out.worldNorm = wn;
        out.color = v.color;
        out.attrs = v.attrs;
        return out;
      }

      @fragment
      fn fs_water(inp : VSOut) -> @location(0) vec4f {
        let N = normalize(inp.worldNorm);
        let V = normalize(u.camTime.xyz - inp.worldPos);
        let L = normalize(vec3f(0.14, 0.96, 0.22));
        let ndv = abs(dot(N, V));
        let fresnel = pow(1.0 - clamp(ndv, 0.0, 1.0), 3.4);
        let H = normalize(L + V);
        let spec = pow(max(abs(dot(N, H)), 0.0), 140.0);

        let kind = inp.attrs.w;
        if (kind >= 1.5) {
          // Glass-like rising bubbles: dark core, bright rim, sharp highlight
          let rim = pow(1.0 - clamp(ndv, 0.0, 1.0), 2.2);
          let core = mix(vec3f(0.35, 0.55, 0.62), inp.color, 0.55);
          let bCol = core * (0.45 + rim * 1.1) + vec3f(0.72, 0.92, 1.0) * fresnel * 0.85
                   + vec3f(spec * 3.4);
          let alpha = mix(0.08, 0.78, rim * 0.85 + fresnel * 0.35);
          return vec4f(bCol, alpha);
        }
        if (kind > 0.5) {
          // Shimmering water surface — mirror at grazing, clearer overhead
          let fSurf = pow(1.0 - clamp(ndv, 0.0, 1.0), 4.2);
          let surfCol = mix(inp.color * 0.62, vec3f(0.68, 0.94, 1.0), fSurf * 0.82)
                      + vec3f(0.15, 0.42, 0.48) * (1.0 - fSurf) * 0.12
                      + vec3f(spec * 2.8);
          let alpha = mix(0.10, 0.62, fSurf);
          return vec4f(surfCol, alpha);
        }
        // Ultra-clear aquarium glass panes with crisp edge sheen
        let glassCol = mix(inp.color * 0.55, vec3f(0.78, 0.96, 0.98), fresnel) + vec3f(spec * 1.1);
        let alpha = mix(0.032, 0.23, fresnel);
        return vec4f(glassCol, alpha);
      }
    `;

    // 5d. HDR Post-Processing (Tuned Bloom + ACES + Vignette)
    const POST_WGSL = /* wgsl */`
      @group(0) @binding(0) var hdrTex : texture_2d<f32>;
      @group(0) @binding(1) var hdrSamp : sampler;

      struct POut {
        @builtin(position) pos : vec4f,
        @location(0) uv : vec2f,
      };

      @vertex
      fn vs_post(@builtin(vertex_index) idx : u32) -> POut {
        var pts = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
        var out : POut;
        out.pos = vec4f(pts[idx], 0.0, 1.0);
        out.uv = vec2f(pts[idx].x * 0.5 + 0.5, 0.5 - pts[idx].y * 0.5);
        return out;
      }

      fn aces(x : vec3f) -> vec3f {
        let a = 2.51;
        let b = 0.03;
        let c = 2.43;
        let d = 0.59;
        let e = 0.14;
        return clamp((x * (a * x + b)) / (x * (c * x + d) + e), vec3f(0.0), vec3f(1.0));
      }

      @fragment
      fn fs_post(inp : POut) -> @location(0) vec4f {
        let base = textureSample(hdrTex, hdrSamp, inp.uv).rgb;
        let texSize = vec2f(textureDimensions(hdrTex));
        let px = 1.0 / texSize;

        var bloom = vec3f(0.0);
        let dirs = array<vec2f, 8>(
          vec2f(1.0, 0.0), vec2f(-1.0, 0.0), vec2f(0.0, 1.0), vec2f(0.0, -1.0),
          vec2f(0.707, 0.707), vec2f(-0.707, 0.707), vec2f(0.707, -0.707), vec2f(-0.707, -0.707)
        );
        for (var r = 1; r <= 3; r++) {
          let rad = f32(r) * 4.0;
          for (var i = 0; i < 8; i++) {
            let s = textureSample(hdrTex, hdrSamp, inp.uv + dirs[i] * rad * px).rgb;
            let lum = dot(s, vec3f(0.2126, 0.7152, 0.0722));
            bloom += s * max(lum - 1.35, 0.0);
          }
        }
        bloom /= 24.0;

        var col = base + bloom * 0.26;
        let d = distance(inp.uv, vec2f(0.5));
        col *= 1.0 - smoothstep(0.5, 0.98, d) * 0.28;

        col = aces(col);
        col = pow(col, vec3f(1.0 / 2.2));
        return vec4f(col, 1.0);
      }
    `;

    const bgModule = device.createShaderModule({ code: BACKDROP_WGSL });
    const sceneModule = device.createShaderModule({ code: SCENE_WGSL });
    const waterModule = device.createShaderModule({ code: WATER_WGSL });
    const postModule = device.createShaderModule({ code: POST_WGSL });

    const vertexLayout = [{
      arrayStride: FLOATS_PER_VERT * 4,
      attributes: [
        { shaderLocation: 0, offset: 0, format: "float32x3" },
        { shaderLocation: 1, offset: 12, format: "float32x3" },
        { shaderLocation: 2, offset: 24, format: "float32x3" },
        { shaderLocation: 3, offset: 36, format: "float32x4" },
      ],
    }];

    const bgPipeline = device.createRenderPipeline({
      layout: "auto",
      vertex: { module: bgModule, entryPoint: "vs_bg" },
      fragment: { module: bgModule, entryPoint: "fs_bg", targets: [{ format: HDR_FORMAT }] },
      primitive: { topology: "triangle-list" },
      multisample: { count: SAMPLE_COUNT },
      depthStencil: { format: "depth24plus", depthWriteEnabled: false, depthCompare: "always" },
    });

    const scenePipeline = device.createRenderPipeline({
      layout: "auto",
      vertex: { module: sceneModule, entryPoint: "vs_main", buffers: vertexLayout },
      fragment: { module: sceneModule, entryPoint: "fs_main", targets: [{ format: HDR_FORMAT }] },
      primitive: { topology: "triangle-list", cullMode: "none" },
      multisample: { count: SAMPLE_COUNT },
      depthStencil: { format: "depth24plus", depthWriteEnabled: true, depthCompare: "less" },
    });

    const waterPipeline = device.createRenderPipeline({
      layout: "auto",
      vertex: { module: waterModule, entryPoint: "vs_water", buffers: vertexLayout },
      fragment: {
        module: waterModule,
        entryPoint: "fs_water",
        targets: [{
          format: HDR_FORMAT,
          blend: {
            color: { srcFactor: "src-alpha", dstFactor: "one-minus-src-alpha", operation: "add" },
            alpha: { srcFactor: "one", dstFactor: "one-minus-src-alpha", operation: "add" },
          },
        }],
      },
      primitive: { topology: "triangle-list", cullMode: "none" },
      multisample: { count: SAMPLE_COUNT },
      depthStencil: { format: "depth24plus", depthWriteEnabled: false, depthCompare: "less" },
    });

    const postPipeline = device.createRenderPipeline({
      layout: "auto",
      vertex: { module: postModule, entryPoint: "vs_post" },
      fragment: { module: postModule, entryPoint: "fs_post", targets: [{ format: swapFormat }] },
      primitive: { topology: "triangle-list" },
    });

    const createUniform = () => device.createBuffer({
      size: 176,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    const bgUniformBuffer = createUniform();
    const subUniformBuffer = createUniform();
    const frameUniformBuffer = createUniform();
    const waterUniformBuffer = createUniform();

    const bgBindGroup = device.createBindGroup({
      layout: bgPipeline.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: { buffer: bgUniformBuffer } }],
    });
    const subBindGroup = device.createBindGroup({
      layout: scenePipeline.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: { buffer: subUniformBuffer } }],
    });
    const frameBindGroup = device.createBindGroup({
      layout: scenePipeline.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: { buffer: frameUniformBuffer } }],
    });
    const waterBindGroup = device.createBindGroup({
      layout: waterPipeline.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: { buffer: waterUniformBuffer } }],
    });

    const linearSampler = device.createSampler({ magFilter: "linear", minFilter: "linear" });

    // Create static aquarium geometry buffers
    const env = buildAquariumEnvironment();
    function makeVertexBuffer(mesh) {
      const buf = device.createBuffer({
        size: Math.max(mesh.data.byteLength, 64),
        usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
      });
      device.queue.writeBuffer(buf, 0, mesh.data);
      return buf;
    }
    const substrateBuffer = makeVertexBuffer(env.substrateMesh);
    const frameBuffer = makeVertexBuffer(env.frameMesh);
    const waterBuffer = makeVertexBuffer(env.waterMesh);

    // =========================================================================
    // 6. Render Targets, Aquarium Ecosystem Spawner & Steering Loop
    // =========================================================================
    let depthTexture = null;
    let hdrMsaaTex = null;
    let hdrResolveTex = null;
    let postBindGroup = null;

    function ensureSize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
      const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
      if (canvas.width !== w || canvas.height !== h || !depthTexture) {
        canvas.width = w;
        canvas.height = h;
        context.configure({ device, format: swapFormat, alphaMode: "opaque" });

        if (depthTexture) depthTexture.destroy();
        if (hdrMsaaTex) hdrMsaaTex.destroy();
        if (hdrResolveTex) hdrResolveTex.destroy();

        depthTexture = device.createTexture({
          size: [w, h],
          format: "depth24plus",
          sampleCount: SAMPLE_COUNT,
          usage: GPUTextureUsage.RENDER_ATTACHMENT,
        });
        hdrMsaaTex = device.createTexture({
          size: [w, h],
          format: HDR_FORMAT,
          sampleCount: SAMPLE_COUNT,
          usage: GPUTextureUsage.RENDER_ATTACHMENT,
        });
        hdrResolveTex = device.createTexture({
          size: [w, h],
          format: HDR_FORMAT,
          sampleCount: 1,
          usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
        });
        postBindGroup = device.createBindGroup({
          layout: postPipeline.getBindGroupLayout(0),
          entries: [
            { binding: 0, resource: hdrResolveTex.createView() },
            { binding: 1, resource: linearSampler },
          ],
        });
      }
    }
    window.addEventListener("resize", ensureSize);
    ensureSize();

    let currentCategory = "random";
    let viewMode = "swarm"; // "swarm" (Aquarium default) | "single" (Inspect)
    let autoCycle = true;
    let autoSpin = true;
    const MAX_SWARM_MODELS = 36;
    const MAX_PLANTS = 14;
    let cycleElapsed = 0;
    let forgedCount = 0;
    let entities = [];

    function destroyEntity(ent) {
      ent.vertexBuffer.destroy();
      ent.uniformBuffer.destroy();
    }

    function clearEntities() {
      for (const ent of entities) destroyEntity(ent);
      entities = [];
    }

    function getCycleSeconds() {
      return viewMode === "swarm" ? 3.0 : 6.0;
    }

    function spawnModel(forcedCat = null, startFullyGrown = false) {
      const t0 = performance.now();
      const seed = (Math.random() * 0xFFFFFFFF) >>> 0;
      const rng = mulberry32(seed);
      const cat = forcedCat || (currentCategory === "random"
        ? CATEGORIES[Math.floor(rng() * CATEGORIES.length)]
        : currentCategory);

      const result = GENERATORS[cat](rng);
      const genMs = (performance.now() - t0).toFixed(1);

      const vertexBuffer = makeVertexBuffer(result.mesh);
      const uBuf = createUniform();
      const bGroup = device.createBindGroup({
        layout: scenePipeline.getBindGroupLayout(0),
        entries: [{ binding: 0, resource: { buffer: uBuf } }],
      });

      forgedCount++;
      cycleElapsed = 0;

      if (viewMode === "single") {
        clearEntities();
        const grounded = GROUNDED_CATS.has(cat);
        entities.push({
          result,
          cat,
          vertexBuffer,
          uniformBuffer: uBuf,
          bindGroup: bGroup,
          pos: [0, grounded ? -1.35 : 0, 0],
          vel: [0, 0, 0],
          swimSpeed: 0,
          yaw: 0,
          pitch: 0,
          prevYaw: 0,
          baseRot: 0,
          rotSpeed: 0.22,
          targetScale: 1.0,
          transitionT: startFullyGrown ? 1 : 0,
          phase: 0,
          wanderFreq: 0,
          grounded: false,
          directional: false,
        });
      } else {
        const grounded = GROUNDED_CATS.has(cat);
        const directional = DIRECTIONAL_CATS.has(cat);

        // Recycle oldest plant if over plant cap, or oldest overall if over tank cap
        if (grounded) {
          const plantCount = entities.filter((e) => e.grounded).length;
          if (plantCount >= MAX_PLANTS) {
            const idx = entities.findIndex((e) => e.grounded);
            if (idx !== -1) {
              destroyEntity(entities[idx]);
              entities.splice(idx, 1);
            }
          }
        }
        if (entities.length >= MAX_SWARM_MODELS) {
          const oldest = entities.shift();
          destroyEntity(oldest);
        }

        let px, py, pz;
        if (grounded) {
          // Place plants naturally along the back and sides of the sand bed
          px = (rng() - 0.5) * 9.8;
          pz = -2.55 + rng() * 4.2;
          if (Math.abs(px) < 1.8 && pz > 0.6) pz -= 1.5; // keep center-front window clear
          py = sandHeight(px, pz) - 0.04;
        } else {
          px = (rng() - 0.5) * 8.6;
          pz = (rng() - 0.5) * 4.2;
          const floorY = sandHeight(px, pz);
          py = floorY + 0.65 + rng() * (2.35 - floorY - 0.65);
        }

        const scale = grounded
          ? 0.48 + rng() * 0.34
          : (cat === "tropical_fish" || cat === "seahorse" || cat === "squid"
            ? 0.32 + rng() * 0.2
            : 0.44 + rng() * 0.24);
        let swimSpeed = 0;
        if (!grounded) {
          if (cat === "jellyfish") swimSpeed = 0.10 + rng() * 0.10;
          else if (cat === "squid" || cat === "seahorse") swimSpeed = 0.14 + rng() * 0.12;
          else if (directional) swimSpeed = 0.35 + rng() * 0.30;
          else swimSpeed = 0.12 + rng() * 0.16;
        }
        const heading = rng() * Math.PI * 2;
        const elev = (rng() - 0.5) * 0.28;

        entities.push({
          result,
          cat,
          vertexBuffer,
          uniformBuffer: uBuf,
          bindGroup: bGroup,
          pos: [px, py, pz],
          vel: grounded ? [0, 0, 0] : [
            Math.cos(elev) * Math.sin(heading) * swimSpeed,
            Math.sin(elev) * swimSpeed * 0.35,
            Math.cos(elev) * Math.cos(heading) * swimSpeed,
          ],
          swimSpeed,
          yaw: heading,
          pitch: 0,
          prevYaw: heading,
          baseRot: rng() * Math.PI * 2,
          rotSpeed: grounded ? 0 : (rng() - 0.5) * 0.18,
          targetScale: scale,
          transitionT: startFullyGrown ? 1 : 0,
          phase: rng() * Math.PI * 2,
          wanderFreq: 0.12 + rng() * 0.16,
          grounded,
          directional,
        });
      }

      modelNameEl.textContent = result.name;
      archetypeBadgeEl.textContent = `[${cat.replace("_", " ").toUpperCase()}]`;
      statSeedEl.textContent = `Seed: #${seed.toString(16).toUpperCase().padStart(8, "0")}`;
      statTrisEl.textContent = `Tris: ${result.mesh.triCount.toLocaleString()}`;
      statTimeEl.textContent = `Gen: ${genMs} ms`;
      statCountEl.textContent = viewMode === "swarm"
        ? `In Tank: ${entities.length} / Total: ${forgedCount}`
        : `Inspected: ${forgedCount}`;
    }

    function populateInitialAquarium() {
      clearEntities();
      forgedCount = 0;
      const initPlants = ["vallisneria", "stem_plant", "broadleaf_coral", "vallisneria", "stem_plant"];
      const initSwimmers = ["tropical_fish", "koi", "turtle", "jellyfish", "tropical_fish"];
      for (const p of initPlants) spawnModel(p, true);
      for (const s of initSwimmers) spawnModel(s, true);
    }

    let camYaw = 0.25;
    let camPitch = 0.14;
    let camDist = 11.6;
    let dragging = false;
    let lastX = 0, lastY = 0;

    canvas.addEventListener("pointerdown", (e) => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });
    window.addEventListener("pointerup", () => { dragging = false; });
    window.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      camYaw -= (e.clientX - lastX) * 0.008;
      camPitch = Math.max(-0.9, Math.min(1.15, camPitch + (e.clientY - lastY) * 0.008));
      lastX = e.clientX;
      lastY = e.clientY;
    });
    canvas.addEventListener("wheel", (e) => {
      camDist = Math.max(2.6, Math.min(22.0, camDist + e.deltaY * 0.006));
    }, { passive: true });

    const btnNext = document.getElementById("btn-next");
    const btnMode = document.getElementById("btn-mode");
    const btnClear = document.getElementById("btn-clear");

    btnNext.addEventListener("click", () => spawnModel());
    btnMode.addEventListener("click", () => {
      viewMode = viewMode === "swarm" ? "single" : "swarm";
      btnMode.textContent = viewMode === "swarm" ? "🌊 Mode: Aquarium" : "🔍 Mode: Inspect";
      btnNext.textContent = viewMode === "swarm" ? "🐠 Spawn Now" : "🐠 Next Species";
      btnClear.style.display = viewMode === "swarm" ? "inline-flex" : "none";
      if (viewMode === "swarm") {
        camYaw = 0.25;
        camPitch = 0.14;
        camDist = 11.6;
        populateInitialAquarium();
      } else {
        camDist = 4.6;
        clearEntities();
        spawnModel(null, false);
      }
    });
    btnClear.addEventListener("click", populateInitialAquarium);
    document.getElementById("btn-toggle-auto").addEventListener("click", (e) => {
      autoCycle = !autoCycle;
      e.target.textContent = autoCycle ? "⏸ Auto: ON" : "▶ Auto: OFF";
    });
    document.getElementById("btn-wire-spin").addEventListener("click", (e) => {
      autoSpin = !autoSpin;
      e.target.textContent = autoSpin ? "🌀 Orbit: ON" : "🌀 Orbit: OFF";
    });
    document.querySelectorAll("#category-pills .pill").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#category-pills .pill").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.dataset.cat;
        spawnModel();
      });
    });
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        spawnModel();
      } else if (e.key === "h" || e.key === "H") {
        hudEl.classList.toggle("hidden");
      }
    });

    populateInitialAquarium();

    let lastFrame = performance.now();
    let camAutoYaw = 0;

    function frame(now) {
      const dt = Math.min((now - lastFrame) * 0.001, 0.1);
      lastFrame = now;
      const t = now * 0.001;
      const cycleSec = getCycleSeconds();

      if (autoCycle) {
        cycleElapsed += dt;
        if (cycleElapsed >= cycleSec) spawnModel();
      }
      const pct = Math.min(100, (cycleElapsed / cycleSec) * 100);
      progressFillEl.style.width = `${pct}%`;
      countdownTextEl.textContent = autoCycle ? `${Math.max(0, cycleSec - cycleElapsed).toFixed(1)}s` : "Paused";

      if (autoSpin && !dragging && viewMode === "swarm") {
        camYaw += dt * 0.06;
      } else if (autoSpin && !dragging && viewMode === "single") {
        camAutoYaw += dt * 0.38;
      }

      ensureSize();
      const aspect = canvas.width / canvas.height;
      const eye = [
        Math.cos(camPitch) * Math.sin(camYaw) * camDist,
        Math.sin(camPitch) * camDist + (viewMode === "swarm" ? 0.55 : 0),
        Math.cos(camPitch) * Math.cos(camYaw) * camDist,
      ];
      const lookTarget = viewMode === "swarm" ? [0, 0.35, 0] : [0, 0, 0];
      const view = mat4LookAt(eye, lookTarget, [0, 1, 0]);
      const proj = mat4Perspective(Math.PI / 4, aspect, 0.1, 80.0);
      const viewProj = mat4Mul(proj, view);

      const latest = entities[entities.length - 1];
      const accent = latest ? latest.result.accent : [0.22, 0.85, 0.78];

      // Update static environment uniform buffers
      const identityMat = mat4Transform3D(0, 0, 0, 0, 0, 1);
      const writeStaticUni = (buf, surfFlag) => {
        const d = new Float32Array(44);
        d.set(viewProj, 0);
        d.set(identityMat, 16);
        d.set([eye[0], eye[1], eye[2], t], 32);
        d.set([0, 0, surfFlag, viewMode === "single" ? 1 : 0], 36);
        d.set([accent[0], accent[1], accent[2], 1], 40);
        device.queue.writeBuffer(buf, 0, d);
      };
      writeStaticUni(bgUniformBuffer, 0);
      writeStaticUni(subUniformBuffer, 1);
      writeStaticUni(frameUniformBuffer, 2);
      writeStaticUni(waterUniformBuffer, 0);

      const encoder = device.createCommandEncoder();

      // Pass 1: HDR 4x MSAA Scene -> Resolve to hdrResolveTex
      const scenePass = encoder.beginRenderPass({
        colorAttachments: [{
          view: hdrMsaaTex.createView(),
          resolveTarget: hdrResolveTex.createView(),
          clearValue: { r: 0.012, g: 0.025, b: 0.042, a: 1.0 },
          loadOp: "clear",
          storeOp: "discard",
        }],
        depthStencilAttachment: {
          view: depthTexture.createView(),
          depthClearValue: 1.0,
          depthLoadOp: "clear",
          depthStoreOp: "discard",
        },
      });

      scenePass.setPipeline(bgPipeline);
      scenePass.setBindGroup(0, bgBindGroup);
      scenePass.draw(3);

      scenePass.setPipeline(scenePipeline);

      // Draw Aquarium Sand/Hardscape + Metal Frame in Aquarium mode
      if (viewMode === "swarm") {
        scenePass.setBindGroup(0, subBindGroup);
        scenePass.setVertexBuffer(0, substrateBuffer);
        scenePass.draw(env.substrateMesh.vertCount);

        scenePass.setBindGroup(0, frameBindGroup);
        scenePass.setVertexBuffer(0, frameBuffer);
        scenePass.draw(env.frameMesh.vertCount);

        // Update 3D Rectangular Glass Tank Swimming Physics
        const LIM_X = TANK_HALF_W - 0.85;
        const LIM_Z = TANK_HALF_D - 0.72;
        const Y_MAX = TANK_WATER_Y - 0.55;

        for (let i = 0; i < entities.length; i++) {
          const ent = entities[i];
          if (ent.grounded) continue;

          const wf = ent.wanderFreq;
          const ph = ent.phase;
          let ax = Math.sin(t * wf + ph) * 0.38 + Math.cos(t * wf * 0.61 + ph * 1.7) * 0.18;
          let ay = Math.sin(t * wf * 0.55 + ph * 2.3) * 0.16;
          let az = Math.cos(t * wf * 0.91 + ph * 1.1) * 0.38 + Math.sin(t * wf * 0.53 + ph * 2.9) * 0.18;

          // Rectangular tank wall repulsion (soft, avoids snap turns)
          const softX = LIM_X - 0.9;
          const softZ = LIM_Z - 0.7;
          if (ent.pos[0] > softX) ax -= (ent.pos[0] - softX) * 1.6;
          if (ent.pos[0] < -softX) ax += (-softX - ent.pos[0]) * 1.6;
          if (ent.pos[2] > softZ) az -= (ent.pos[2] - softZ) * 1.6;
          if (ent.pos[2] < -softZ) az += (-softZ - ent.pos[2]) * 1.6;

          const floorY = sandHeight(ent.pos[0], ent.pos[2]) + 0.65;
          if (ent.pos[1] < floorY) ay += (floorY - ent.pos[1]) * 1.9;
          if (ent.pos[1] > Y_MAX) ay -= (ent.pos[1] - Y_MAX) * 1.9;

          // Soft separation between swimmers
          for (let j = 0; j < entities.length; j++) {
            if (i === j) continue;
            const o = entities[j];
            const dx = ent.pos[0] - o.pos[0];
            const dy = ent.pos[1] - o.pos[1];
            const dz = ent.pos[2] - o.pos[2];
            const d2 = dx * dx + dy * dy + dz * dz;
            if (d2 > 0.001 && d2 < 2.1) {
              const d = Math.sqrt(d2);
              const push = (1.45 - d) * 0.85;
              ax += (dx / d) * push;
              ay += (dy / d) * push;
              az += (dz / d) * push;
            }
          }

          ent.vel[0] += ax * dt;
          ent.vel[1] += ay * dt;
          ent.vel[2] += az * dt;

          const spd = Math.hypot(ent.vel[0], ent.vel[1], ent.vel[2]) || 0.001;
          const blend = ent.swimSpeed / spd;
          const lerpAmt = Math.min(1, 1.0 * dt);
          ent.vel[0] = ent.vel[0] * (1 - lerpAmt) + ent.vel[0] * blend * lerpAmt;
          ent.vel[1] = ent.vel[1] * (1 - lerpAmt) + ent.vel[1] * blend * lerpAmt;
          ent.vel[2] = ent.vel[2] * (1 - lerpAmt) + ent.vel[2] * blend * lerpAmt;

          ent.pos[0] += ent.vel[0] * dt;
          ent.pos[1] += ent.vel[1] * dt;
          ent.pos[2] += ent.vel[2] * dt;

          // Hard containment safety clamp inside the glass panes
          ent.pos[0] = Math.max(-LIM_X, Math.min(LIM_X, ent.pos[0]));
          ent.pos[2] = Math.max(-LIM_Z, Math.min(LIM_Z, ent.pos[2]));
          const minY = sandHeight(ent.pos[0], ent.pos[2]) + 0.35;
          ent.pos[1] = Math.max(minY, Math.min(TANK_WATER_Y - 0.35, ent.pos[1]));

          if (ent.directional) {
            const targetYaw = Math.atan2(ent.vel[0], ent.vel[2]);
            let diff = targetYaw - ent.yaw;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            ent.yaw += diff * Math.min(1, dt * 1.9);
            const yawRate = (ent.yaw - (ent.prevYaw ?? ent.yaw)) / Math.max(dt, 0.0001);
            ent.prevYaw = ent.yaw;
            const horiz = Math.hypot(ent.vel[0], ent.vel[2]) || 0.001;
            const bank = Math.max(-0.22, Math.min(0.22, yawRate * 0.12));
            const targetPitch = -Math.atan2(ent.vel[1], horiz) * 0.55 + bank;
            ent.pitch += (targetPitch - ent.pitch) * Math.min(1, dt * 1.7);
          } else {
            ent.yaw = ent.baseRot + t * ent.rotSpeed;
            ent.pitch = Math.sin(t * 0.55 + ent.phase) * 0.10;
          }
        }
      }

      // Draw all creatures & plants
      for (const ent of entities) {
        ent.transitionT = Math.min(1, ent.transitionT + dt * 2.6);
        const easeOut = 1 - Math.pow(1 - ent.transitionT, 3);
        const s = ent.targetScale * easeOut;

        const yaw = viewMode === "single" ? camAutoYaw : ent.yaw;
        const pitch = viewMode === "single" ? 0 : ent.pitch;
        const modelMat = mat4Transform3D(ent.pos[0], ent.pos[1], ent.pos[2], yaw, pitch, s);

        const uData = new Float32Array(44);
        uData.set(viewProj, 0);
        uData.set(modelMat, 16);
        uData.set([eye[0], eye[1], eye[2], t], 32);
        uData.set([ent.result.animMode, ent.result.sss, 0, viewMode === "single" ? 1 : 0], 36);
        uData.set([ent.result.accent[0], ent.result.accent[1], ent.result.accent[2], 1], 40);
        device.queue.writeBuffer(ent.uniformBuffer, 0, uData);

        scenePass.setBindGroup(0, ent.bindGroup);
        scenePass.setVertexBuffer(0, ent.vertexBuffer);
        scenePass.draw(ent.result.mesh.vertCount);
      }

      // Draw Transparent Glass Walls, Water Surface & Rising Bubbles in Aquarium mode
      if (viewMode === "swarm") {
        scenePass.setPipeline(waterPipeline);
        scenePass.setBindGroup(0, waterBindGroup);
        scenePass.setVertexBuffer(0, waterBuffer);
        scenePass.draw(env.waterMesh.vertCount);
      }

      scenePass.end();

      // Pass 2: Bloom + ACES Tone Mapping -> Swapchain
      const postPass = encoder.beginRenderPass({
        colorAttachments: [{
          view: context.getCurrentTexture().createView(),
          clearValue: { r: 0, g: 0, b: 0, a: 1 },
          loadOp: "clear",
          storeOp: "store",
        }],
      });
      postPass.setPipeline(postPipeline);
      postPass.setBindGroup(0, postBindGroup);
      postPass.draw(3);
      postPass.end();

      device.queue.submit([encoder.finish()]);
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
